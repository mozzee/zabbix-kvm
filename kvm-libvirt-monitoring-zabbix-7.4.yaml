---
zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: e344c064fadc414db1b96b793d26a9e2
    name: Templates/Virtualization
  templates:
  - uuid: 286a89b7448d4f459ef4c11a616b44c2
    template: KVM Libvirt Monitoring
    name: KVM Libvirt Monitoring
    groups:
    - name: Templates/Virtualization
    description: Monitors libvirt domains through the existing Zabbix Agent 2 kvm.raw UserParameter.
    items:
    - uuid: 831a647aa62d4026ac5122b37b90fce8
      name: 'KVM collector: Raw JSON'
      type: ZABBIX_PASSIVE
      key: kvm.raw
      delay: 1m
      history: 1d
      trends: '0'
      value_type: TEXT
    - uuid: 19dd0a538a414861ae3d30b3083d925e
      name: 'KVM collector: Timestamp'
      type: DEPENDENT
      key: kvm.collector.timestamp
      delay: '0'
      history: 30d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.timestamp"
      master_item:
        key: kvm.raw
      triggers:
      - uuid: 01605c608a7845fa84294c0a930096f3
        name: KVM collector data is stale or missing
        expression: nodata(/KVM Libvirt Monitoring/kvm.collector.timestamp,{$KVM.COLLECTOR.MAX.AGE})=1 or abs(last(/KVM Libvirt Monitoring/kvm.collector.timestamp)-now())>{$KVM.COLLECTOR.MAX.AGE}
        priority: WARNING
        description: Checks collector time against Zabbix time and detects missing parsed timestamps.
    - uuid: a62a56735190403786bf82d349a5b3c8
      name: 'KVM: Total VMs'
      type: DEPENDENT
      key: kvm.vm.count
      delay: '0'
      history: 30d
      trends: 365d
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.vm_count"
      master_item:
        key: kvm.raw
    - uuid: 432b6105d3a54ac88e3c4c47e98b7328
      name: 'KVM: Running VMs'
      type: DEPENDENT
      key: kvm.vm.running.count
      delay: '0'
      history: 30d
      trends: 365d
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.running_count"
      master_item:
        key: kvm.raw
    discovery_rules:
    - uuid: df3503f52a724d2d977e25ad381ac0c3
      name: KVM VM discovery
      type: DEPENDENT
      key: kvm.vm.discovery
      delay: '0'
      master_item:
        key: kvm.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.vms"
      lld_macro_paths:
      - lld_macro: "{#VM.UUID}"
        path: "$.uuid"
      - lld_macro: "{#VM.NAME}"
        path: "$.name"
      item_prototypes:
      - uuid: ef92625cbf13422fa1d965c64466a1f3
        name: "{#VM.NAME}: State"
        type: DEPENDENT
        key: kvm.vm.state[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        valuemap:
          name: Libvirt domain state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].state.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: kvm.raw
      - uuid: b33b7863b05949b7aea53a48dc9954bf
        name: "{#VM.NAME}: vCPUs"
        type: DEPENDENT
        key: kvm.vm.vcpus[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].vcpus.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: kvm.raw
      - uuid: a68dbcbfb98643239cd19c6134100a17
        name: "{#VM.NAME}: CPU utilization (100% per core)"
        type: DEPENDENT
        key: kvm.vm.cpu.util[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: "%"
        value_type: FLOAT
        description: Aggregate CPU usage across vCPUs. 100% equals one fully utilized logical CPU.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].cpu_time_ms.first()
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '0.1'
        master_item:
          key: kvm.raw
      - uuid: 44859d4c8a5a446abb22bc77f98e0f2c
        name: "{#VM.NAME}: Allocated memory"
        type: DEPENDENT
        key: kvm.vm.memory.allocated[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].mem_alloc_bytes.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: kvm.raw
      - uuid: 6e8b89741c954ea1b19ea20eb3e8257b
        name: "{#VM.NAME}: Host resident memory"
        type: DEPENDENT
        key: kvm.vm.memory.rss[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].mem_rss_bytes.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: kvm.raw
      - uuid: 1133f194814a4157a56e5193dd1085b0
        name: "{#VM.NAME}: Guest memory utilization"
        type: DEPENDENT
        key: kvm.vm.memory.guest.util[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: "%"
        value_type: FLOAT
        description: Populated only when the collector reports guest memory utilization.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].guest_mem_util_pct.first()
          error_handler: DISCARD_VALUE
        - type: IN_RANGE
          parameters:
          - '0'
          - '100'
          error_handler: DISCARD_VALUE
        master_item:
          key: kvm.raw
      - uuid: e19b1a1bf2fb4e9b84af615cee4ba3af
        name: "{#VM.NAME}: Disk read throughput"
        type: DEPENDENT
        key: kvm.vm.disk.read[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: Bps
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].disk_read_bytes.first()
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
        master_item:
          key: kvm.raw
      - uuid: f74070d15dc14faa869bc7ca5ecbf6ad
        name: "{#VM.NAME}: Disk write throughput"
        type: DEPENDENT
        key: kvm.vm.disk.write[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: Bps
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].disk_write_bytes.first()
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
        master_item:
          key: kvm.raw
      - uuid: 9e88dd07941c41e481212c92b561db4e
        name: "{#VM.NAME}: Network receive throughput"
        type: DEPENDENT
        key: kvm.vm.net.rx[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: bps
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].net_rx_bytes.first()
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: kvm.raw
      - uuid: 62d970aac059416986d7ef19e12d15a8
        name: "{#VM.NAME}: Network transmit throughput"
        type: DEPENDENT
        key: kvm.vm.net.tx[{#VM.UUID}]
        delay: '0'
        history: 30d
        trends: 365d
        units: bps
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.vms[?(@.uuid == "{#VM.UUID}")].net_tx_bytes.first()
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: kvm.raw
      trigger_prototypes:
      - uuid: 7ce8525fff8640f284a94cad38453eb4
        name: "{#VM.NAME}: Expected running VM is not active"
        expression: '{$KVM.VM.EXPECT.RUNNING:"{#VM.UUID}"}=1 and count(/KVM Libvirt Monitoring/kvm.vm.state[{#VM.UUID}],#3,"ge",3)=3 and nodata(/KVM Libvirt Monitoring/kvm.vm.state[{#VM.UUID}],{$KVM.COLLECTOR.MAX.AGE})=0 and abs(last(/KVM Libvirt Monitoring/kvm.collector.timestamp)-now())<={$KVM.COLLECTOR.MAX.AGE}'
        priority: WARNING
        description: Alerts after three consecutive paused, shutting down, shut off, crashed or suspended readings while collector data is fresh.
      graph_prototypes:
      - uuid: 6ea57805775b47059f594dbc5bc9c9f4
        name: "{#VM.NAME}: CPU utilization"
        graph_items:
        - sortorder: '0'
          color: 199C0D
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.cpu.util[{#VM.UUID}]
      - uuid: 6195f985890e4064b78797779914c2ad
        name: "{#VM.NAME}: Memory"
        graph_items:
        - sortorder: '0'
          color: 199C0D
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.memory.allocated[{#VM.UUID}]
        - sortorder: '1'
          color: 2774C8
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.memory.rss[{#VM.UUID}]
      - uuid: 0adb00a9d37a4e2693d5cecd2ad9be63
        name: "{#VM.NAME}: Disk throughput"
        graph_items:
        - sortorder: '0'
          color: 199C0D
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.disk.read[{#VM.UUID}]
        - sortorder: '1'
          color: 2774C8
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.disk.write[{#VM.UUID}]
      - uuid: a88c28483c7d48c2830006f13511f67a
        name: "{#VM.NAME}: Network throughput"
        graph_items:
        - sortorder: '0'
          color: 199C0D
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.net.rx[{#VM.UUID}]
        - sortorder: '1'
          color: 2774C8
          item:
            host: KVM Libvirt Monitoring
            key: kvm.vm.net.tx[{#VM.UUID}]
    macros:
    - macro: "{$KVM.COLLECTOR.MAX.AGE}"
      value: '300'
      description: Maximum collector timestamp skew and no-data interval in seconds.
    - macro: "{$KVM.VM.EXPECT.RUNNING}"
      value: '0'
      description: Set a UUID-context host macro to 1 for each VM expected to stay active.
    valuemaps:
    - uuid: c987da4081704bb4a0ced7b011fc2b84
      name: Libvirt domain state
      mappings:
      - value: '0'
        newvalue: No state
      - value: '1'
        newvalue: Running
      - value: '2'
        newvalue: Blocked
      - value: '3'
        newvalue: Paused
      - value: '4'
        newvalue: Shutting down
      - value: '5'
        newvalue: Shut off
      - value: '6'
        newvalue: Crashed
      - value: '7'
        newvalue: Suspended
